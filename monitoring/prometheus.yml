global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-server"
    static_configs:
      - targets: ["host.docker.internal:9000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "worker"
    static_configs:
      - targets: ["host.docker.internal:9001"]
    metrics_path: /metrics
    scrape_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
